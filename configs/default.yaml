# Resolved config for a training run. Every hyperparameter/path used by the
# code lives here, not hardcoded in modules (see planning/CLAUDE.md).
#
# Sections beyond env/policy/ppo/train/logging (eval, video) are added in
# later build slices, once those modules exist.

env:
  # Max plies (half-moves) before the game is cut off and adjudicated by
  # material balance, to bound episode length (planning/CLAUDE.md: "enforce
  # a max-move cap that adjudicates by material").
  max_moves: 200
  # Reward shaping: small bonus/penalty for the change in material balance
  # caused by the mover's own move. Kept low so it doesn't dominate the
  # terminal +-1/0 outcome reward (planning/SPEC.md sec 0).
  material_shaping_enabled: true
  material_shaping_coef: 0.01

policy:
  num_filters: 64
  num_res_blocks: 6
  value_hidden_dim: 64

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  lr: 0.0003
  epochs: 4
  minibatch_size: 256
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  games_per_batch: 8

train:
  num_updates: 400
  # "auto" resolves to cuda if available, else cpu -- no CUDA-only
  # assumptions, since local dev runs on CPU while real training targets a
  # single cloud GPU (Kaggle).
  device: auto

logging:
  run_dir: runs
  # null -> auto-generate a timestamp-based run id.
  run_id: null
  rolling_window: 50
  checkpoint_interval: 10
  sample_games_per_checkpoint: 4

eval:
  # STOCKFISH_PATH env var overrides this. null + no env var -> accuracy
  # eval is skipped entirely (rlchess/eval.py guards this; the rest of the
  # pipeline runs fine without Stockfish).
  stockfish_path: null
  sample_rate: 0.25
  depth: 8
  cp_clip: 1000
  rolling_window: 50

video:
  fps: 30
  board_size: 480
  # ~1.4 moves/sec, within SPEC's "1-2 moves/sec" target.
  slow_motion_seconds_per_move: 0.7
  metric_timelapse_seconds: 4
  slow_at: [0.1, 0.35, 0.6, 0.85, 1.0]
